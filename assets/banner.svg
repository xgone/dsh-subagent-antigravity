<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Antigravity Subagent for DeepSeek Harness</title>
  <desc id="desc">A task moves from a DSH terminal through a luminous orbital agent network to an Antigravity result panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="0.52" stop-color="#10182f"/>
      <stop offset="1" stop-color="#211229"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#67e8f9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="orb" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131e34" stop-opacity=".95"/>
      <stop offset="1" stop-color="#101522" stop-opacity=".93"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bb7d4" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a5f3fc" fill-opacity=".15"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" fill="url(#bg)"/>
  <rect width="1440" height="480" fill="url(#grid)"/>
  <rect width="1440" height="480" fill="url(#dots)" opacity=".45"/>
  <ellipse cx="775" cy="244" rx="420" ry="280" fill="url(#blueGlow)"/>
  <ellipse cx="1130" cy="230" rx="300" ry="250" fill="url(#coralGlow)"/>

  <g fill="#dbeafe" fill-opacity=".7">
    <circle cx="516" cy="83" r="1.6"/><circle cx="610" cy="391" r="1.3"/>
    <circle cx="923" cy="77" r="1.4"/><circle cx="1360" cy="360" r="1.6"/>
    <circle cx="1020" cy="422" r="1.2"/><circle cx="83" cy="76" r="1.1"/>
  </g>

  <!-- Input terminal -->
  <g>
    <rect x="68" y="112" width="365" height="256" rx="22" fill="url(#panel)" stroke="#6b849e" stroke-opacity=".42"/>
    <path d="M68 155H433" stroke="#7892ad" stroke-opacity=".22"/>
    <circle cx="96" cy="134" r="5" fill="#fb7185"/>
    <circle cx="115" cy="134" r="5" fill="#fbbf24"/>
    <circle cx="134" cy="134" r="5" fill="#34d399"/>
    <rect x="98" y="188" width="14" height="14" rx="3" fill="#67e8f9" fill-opacity=".9"/>
    <path d="m103 191 5 4-5 4" fill="none" stroke="#082033" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="127" y="190" width="178" height="7" rx="3.5" fill="#9fb7cf" fill-opacity=".58"/>
    <rect x="98" y="226" width="205" height="6" rx="3" fill="#7dd3fc" fill-opacity=".68"/>
    <rect x="98" y="250" width="268" height="6" rx="3" fill="#a5b4c8" fill-opacity=".34"/>
    <rect x="98" y="274" width="229" height="6" rx="3" fill="#a5b4c8" fill-opacity=".28"/>
    <rect x="98" y="298" width="152" height="6" rx="3" fill="#fda4af" fill-opacity=".56"/>
    <rect x="98" y="335" width="9" height="9" rx="2" fill="#67e8f9"/>
    <rect x="116" y="337" width="109" height="5" rx="2.5" fill="#d9e7f4" fill-opacity=".44"/>
  </g>

  <!-- Handoff path -->
  <path d="M434 240C530 240 545 190 621 190" fill="none" stroke="url(#orbit)" stroke-width="2" stroke-dasharray="5 10"/>
  <path d="M434 254C540 254 565 294 650 294" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.4"/>
  <path d="M852 190C945 190 950 222 1018 222" fill="none" stroke="url(#orbit)" stroke-width="2" stroke-dasharray="5 10"/>
  <path d="M850 292C946 292 967 260 1018 260" fill="none" stroke="#fb7185" stroke-opacity=".55" stroke-width="1.4"/>

  <!-- Orbital agent core -->
  <g transform="translate(760 240)">
    <ellipse rx="205" ry="77" transform="rotate(-18)" fill="none" stroke="url(#orbit)" stroke-width="2.2"/>
    <ellipse rx="170" ry="119" transform="rotate(31)" fill="none" stroke="#93c5fd" stroke-opacity=".28" stroke-width="1.3"/>
    <ellipse rx="137" ry="53" transform="rotate(72)" fill="none" stroke="#fb7185" stroke-opacity=".34" stroke-width="1.2" stroke-dasharray="4 8"/>
    <circle cx="-194" cy="-57" r="6" fill="#67e8f9"/>
    <circle cx="174" cy="-84" r="5" fill="#fb7185"/>
    <circle cx="98" cy="102" r="4.5" fill="#a5f3fc"/>
    <circle cx="-80" cy="112" r="4" fill="#fda4af"/>
    <circle r="58" fill="#12324a" fill-opacity=".8" stroke="#7dd3fc" stroke-opacity=".6" stroke-width="1.4"/>
    <circle r="42" fill="url(#orb)" fill-opacity=".94"/>
    <circle r="26" fill="#0c1728" fill-opacity=".75"/>
    <path d="M-9 15V-15L0-23 9-15V15M-16-5H16M-12 6H12" fill="none" stroke="#cffafe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Returned result -->
  <g>
    <rect x="1018" y="139" width="344" height="202" rx="22" fill="url(#panel)" stroke="#7a7891" stroke-opacity=".48"/>
    <circle cx="1060" cy="185" r="15" fill="#34d399" fill-opacity=".16" stroke="#6ee7b7" stroke-opacity=".7"/>
    <path d="m1053 185 5 5 10-12" fill="none" stroke="#a7f3d0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1088" y="181" width="167" height="8" rx="4" fill="#dbeafe" fill-opacity=".78"/>
    <rect x="1054" y="222" width="258" height="6" rx="3" fill="#a5b4c8" fill-opacity=".42"/>
    <rect x="1054" y="246" width="227" height="6" rx="3" fill="#a5b4c8" fill-opacity=".33"/>
    <rect x="1054" y="270" width="188" height="6" rx="3" fill="#7dd3fc" fill-opacity=".56"/>
    <rect x="1054" y="306" width="65" height="4" rx="2" fill="#fb7185" fill-opacity=".72"/>
    <rect x="1127" y="306" width="118" height="4" rx="2" fill="#67e8f9" fill-opacity=".56"/>
  </g>

  <path d="M0 421C205 367 362 442 536 410s296-60 470-12 274 44 434-7" fill="none" stroke="#7dd3fc" stroke-opacity=".12" stroke-width="1"/>
  <path d="M0 440C201 386 359 460 538 428s296-58 471-11 275 45 431-6" fill="none" stroke="#fb7185" stroke-opacity=".10" stroke-width="1"/>
</svg>
