# Antigravity subagent bundle patch.
#
# Inserts one provider row and one model-facing tool row. The tool row reuses the
# shipped `@deepseek-ai/dsh-tool-subagent` package (resolved from the running DSH
# installation) and only binds it to this provider.
#
#   subagent-antigravity : registers provider name `antigravity` on ctx.subagents
#   tool-subagent-antigravity : exposes `subagent_antigravity` as a global tool
#
# The child Agent route is pinned to the CLI adapter this plugin registers
# (`agy-stream`/`native`): DSH owns the child Session, the Antigravity CLI owns
# the model calls and its own tool execution.
#
# Install with:
#   dsh plugin --profile <name> add /path/to/antigravity-subagent
# or in-session via plugin_manager's install_bundle with that absolute directory.
- insert:
    - id: subagent-antigravity
      name: '@xgone/dsh-subagent-antigravity'
    - id: tool-subagent-antigravity
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: antigravity
        toolName: subagent_antigravity
        agentOptions:
          provider: agy-stream
          model: native
